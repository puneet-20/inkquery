<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D5DF6"/>
      <stop offset="100%" stop-color="#3B2FD6"/>
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9E6FF"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- ink drop shape -->
  <path d="M32 10
           C 40 22, 46 30, 46 37
           A 14 14 0 1 1 18 37
           C 18 30, 24 22, 32 10 Z"
        fill="url(#drop)"/>

  <!-- query dot / magnifier accent cut into the drop -->
  <circle cx="32" cy="40" r="3.4" fill="#3B2FD6"/>
  <rect x="30.7" y="30" width="2.6" height="8" rx="1.3" fill="#3B2FD6"/>
</svg>
